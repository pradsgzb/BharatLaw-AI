          description: Not found or not authorized
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ResearchRequest:
      type: object
      additionalProperties: false
      properties:
        workspace_id: *id001
        question:
          type: string
          minLength: 3
          maxLength: 12000
        language:
          type: string
          enum:
          - en
          - hi
        research_mode:
          type: string
          enum:
          - contemporaneous
          - retrospective_analysis
        depth:
          type: string
          enum:
          - quick
          - deep
        jurisdiction_key: *id002
        event_date:
          anyOf:
          - *id003
          - type: 'null'
        law_as_of: *id003
        authority_cutoff: *id003
        include_private_documents: &id004
          type: boolean
        corpus_release_id:
          anyOf:
          - *id001
          - type: 'null'
      required:
      - workspace_id
      - question
      - language
      - research_mode
      - depth
      - jurisdiction_key
      - law_as_of
      - authority_cutoff
      - include_private_documents
    Answer:
      $schema: https://json-schema.org/draft/2020-12/schema
      $id: https://example.org/bharatlaw/contracts/answer.schema.json
      title: BharatLaw answer v1
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        answer_id:
          type: string
          format: uuid
        run_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - answered
          - partial
          - abstained
          - needs_clarification
        language:
          type: string
          enum:
          - en
          - hi
        direct_response:
          type: string
        law_as_of:
          type: string
          format: date
        authority_cutoff:
          type: string
          format: date
        corpus_release_id:
          type: string
          format: uuid
        claims:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              claim_id:
                type: string
                pattern: ^C[1-9][0-9]*$
              text:
                type: string
              kind:
                type: string
                enum:
                - legal_proposition
                - analysis
                - user_provided_fact
                - limitation
              support_status:
                type: string
                enum:
                - supported
                - conflict
                - needs_review
                - not_applicable
              supporting_evidence:
                type: array
                items:
                  type: string
                  pattern: ^E[1-9][0-9]*$
                minItems: 0
              contrary_evidence:
                type: array
                items:
                  type: string
                  pattern: ^E[1-9][0-9]*$
                minItems: 0
            required:
            - claim_id
            - text
            - kind
            - support_status
            - supporting_evidence
            - contrary_evidence
          minItems: 0
        citations:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              handle:
                type: string
                pattern: ^E[1-9][0-9]*$
              span_id:
                type: string
                format: uuid
              source_class:
                type: string
                enum:
                - public_authority
                - private_upload
              source_title:
                type: string
              display_citation:
                type: string
              pinpoint:
                type: string
              viewer_path:
                type: string
                pattern: ^/v1/
              official_url:
                anyOf:
                - type: string
                  format: uri
                - type: 'null'
              excerpt:
                type: string
              source_sha256:
                type: string
                pattern: ^[a-f0-9]{64}$
                description: SHA-256 of UTF-8 canonical unit text containing the cited
                  span; not the PDF byte hash. Resolve source artifact hash through
                  immutable document/version lineage.
              role_label:
                type: string
                enum:
                - operative_text
                - court_reasoning
                - party_argument
                - quoted_authority
                - headnote
                - footnote
                - unclassified
              opinion_type:
                type: string
            required:
            - handle
            - span_id
            - source_class
            - source_title
            - display_citation
            - pinpoint
            - viewer_path
            - official_url
            - excerpt
            - source_sha256
            - role_label
            - opinion_type
          minItems: 0
        assumptions:
          type: array
          items:
            type: string
          minItems: 0
        limitations:
          type: array
          items:
            type: string
          minItems: 0
        clarifying_questions:
          type: array
          items:
            type: string
          minItems: 0
        coverage:
          type: object
          additionalProperties: false
          properties:
            source_keys:
              type: array
              items:
                type: string
              minItems: 0
            court_keys:
              type: array
              items:
                type: string
              minItems: 0
            covered_through:
              anyOf:
              - type: string
                format: date
              - type: 'null'
            last_successful_sync_at:
              anyOf:
              - type: string
                format: date-time
              - type: 'null'
            known_gaps:
              type: array
              items:
                type: string
              minItems: 0
          required:
          - source_keys
          - court_keys
          - covered_through
          - last_successful_sync_at
          - known_gaps
        verification:
          type: object
          additionalProperties: false
          properties:
            deterministic_integrity_passed:
              type: boolean
            semantic_assessment:
              type: string
              enum:
              - supported
              - partial
              - conflicting
              - insufficient
              - not_applicable
            lawyer_reviewed:
              type: boolean
            verifier_profile:
              type: string
          required:
          - deterministic_integrity_passed
          - semantic_assessment
          - lawyer_reviewed
          - verifier_profile
      required:
      - schema_version
      - answer_id
      - run_id
      - status
      - language
      - direct_response
      - law_as_of
      - authority_cutoff
      - corpus_release_id
      - claims
      - citations
      - assumptions
      - limitations
      - clarifying_questions
      - coverage
      - verification
    LegalDocument:
      type: object
      additionalProperties: false
      properties:
        schema_version:
          const: '1.0'
        is_synthetic: *id004
        document_id: *id001
        document_version_id: *id001
        canonical_key: *id002
        document_type:
          type: string
          enum:
          - constitution
          - act
          - rule
          - regulation
          - notification
          - ordinance
          - judgment
          - order
          - amendment
          - circular
        title: *id002
        jurisdiction_key: *id002
        language:
          type: string
          enum:
          - en
          - hi
        representation_kind:
          type: string
          enum:
          - official_published
          - editorial_consolidation
          - official_translation
          - machine_translation
          - synthetic_fixture
        publication_date:
          anyOf:
          - *id003
          - type: 'null'
        edition_as_of:
          anyOf:
          - *id003
          - type: 'null'
        decision_date:
          anyOf:
          - *id003
          - type: 'null'
        source:
          type: object
          additionalProperties: false
          properties:
            source_id: *id001
            artifact_id: *id001
            source_url:
              type: string
              format: uri
            fetched_at: &id006
              type: string
              format: date-time
            artifact_sha256: &id005
              type: string
              pattern: ^[a-f0-9]{64}$
              description: SHA-256 of UTF-8 canonical unit text containing the cited
                span; not the PDF byte hash. Resolve source artifact hash through
                immutable document/version lineage.
            media_type: *id002
            object_version: *id002
            policy_id: *id001
          required:
          - source_id
          - artifact_id
          - source_url
          - fetched_at
          - artifact_sha256
          - media_type
          - object_version
          - policy_id
        extraction:
          type: object
          additionalProperties: false
          properties:
            extraction_id: *id001
            parser_profile: *id002
            config_sha256: *id005
            used_ocr: *id004
            review_state:
              type: string
              enum:
              - pending
              - quarantined
              - validated
              - approved
              - fixture_only
          required:
          - extraction_id
          - parser_profile
          - config_sha256
          - used_ocr
          - review_state
        units:
          type: array
          items: &id008
            type: object
            additionalProperties: false
            properties:
              unit_id: *id001
              unit_version_id: *id001
              parent_unit_id:
                anyOf:
                - *id001
                - type: 'null'
              unit_type:
                type: string
                enum:
                - article
                - section
                - subsection
                - clause
                - proviso
                - explanation
                - schedule
                - paragraph
                - footnote
                - table
                - heading
              unit_key: *id002
              display_label: *id002
              structural_path:
                type: array
                items: *id002
                minItems: 1
              original_paragraph_label:
                anyOf:
                - *id002
                - type: 'null'
              opinion_type:
                type: string
                enum:
                - majority
                - concurrence
                - dissent
                - plurality
                - per_curiam
                - unknown
                - not_applicable
              role_label:
                type: string
                enum:
                - operative_text
                - court_reasoning
                - party_argument
                - quoted_authority
                - headnote
                - footnote
                - unclassified
              exact_text:
                type: string
                minLength: 1
              text_sha256: *id005
              language:
                type: string
                enum:
                - en
                - hi
              spans:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    span_id: *id001
                    char_start: &id007
                      type: integer
                      minimum: 0
                    char_end:
                      type: integer
                      minimum: 1
                    quote_sha256: *id005
                    anchors:
                      type: array
                      items: &id009
                        type: object
                        additionalProperties: false
                        properties:
                          pdf_page_number:
                            type: integer
                            minimum: 1
                          printed_page_label:
                            anyOf:
                            - *id002
                            - type: 'null'
                          bbox:
                            type: array
                            items:
                              type: number
                              minimum: 0
                              maximum: 1
                            minItems: 4
                            maxItems: 4
                          origin:
                            const: top-left
                        required:
                        - pdf_page_number
                        - printed_page_label
                        - bbox
                        - origin
                      minItems: 0
                  required:
                  - span_id
                  - char_start
                  - char_end
                  - quote_sha256
                  - anchors
                minItems: 1
            required:
            - unit_id
            - unit_version_id
            - parent_unit_id
            - unit_type
            - unit_key
            - display_label
            - structural_path
            - original_paragraph_label
            - opinion_type
            - role_label
            - exact_text
            - text_sha256
            - language
            - spans
          minItems: 1
      required:
      - schema_version
      - is_synthetic
      - document_id
      - document_version_id
      - canonical_key
      - document_type
      - title
      - jurisdiction_key
      - language
      - representation_kind
      - publication_date
      - edition_as_of
      - decision_date
      - source
      - extraction
      - units
    Citation:
      type: object
      additionalProperties: false
      properties:
        handle:
          type: string
          pattern: ^E[1-9][0-9]*$
        span_id: *id001
        source_class:
          type: string
          enum:
          - public_authority
          - private_upload
        source_title: *id002
